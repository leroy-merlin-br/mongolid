name: Reusable GitHub Copilot CLI

on:
  workflow_call:
    inputs:
      prompt:
        description: Prompt sent to GitHub Copilot CLI (required unless command is set)
        required: false
        type: string
        default: ""
      command:
        description: Shell command to run instead of the Copilot prompt; requires execution-mode edit
        required: false
        type: string
        default: ""
      execution-mode:
        description: "Execution mode: text returns a response; edit modifies repository files and optionally opens a PR"
        required: false
        type: string
        default: text
      copilot-cli-version:
        description: Version of the GitHub Copilot CLI package to install
        required: false
        type: string
        default: 1.0.93
      model:
        description: Copilot model ID; availability depends on the CLI version and account
        required: false
        type: string
        default: auto
      base-branch:
        description: Branch to check out and target with the PR in edit mode
        required: false
        type: string
        default: master
      fetch-depth:
        description: Number of commits to fetch on checkout in edit mode; use 0 for the full history
        required: false
        type: number
        default: 1
      pr-branch:
        description: Branch used for changes generated by Copilot
        required: false
        type: string
        default: automation/copilot-changes
      pr-title:
        description: Title of the generated PR
        required: false
        type: string
        default: "chore: apply automated changes"
      pr-body:
        description: Body of the generated pull request (supports Markdown)
        required: false
        type: string
        default: |
          Automatically proposed changes using GitHub Copilot CLI.

          Please review all changes before merging.
      pr-labels:
        description: Comma-separated labels for the generated PR (labels must already exist)
        required: false
        type: string
        default: ""
      commit-paths:
        description: "Newline-separated Git pathspecs eligible for the commit and PR; does not restrict Copilot reading or writing"
        required: false
        type: string
        default: ""
    secrets:
      COPILOT_TOKEN:
        description: Optional fine-grained PAT with Copilot Requests permission; defaults to GITHUB_TOKEN
        required: false
      PR_TOKEN:
        description: Optional GitHub App/PAT token for creating PRs and triggering downstream workflows
        required: false
    outputs:
      ai-response:
        description: Untrusted CLI text response (text mode only)
        value: ${{ jobs.execute-copilot.outputs.ai-response }}
      pull-request-number:
        description: PR number if one was created or updated (edit mode)
        value: ${{ jobs.create-pr.outputs.pull-request-number }}
      pull-request-url:
        description: PR URL if one was created or updated (edit mode)
        value: ${{ jobs.create-pr.outputs.pull-request-url }}
      changes-detected:
        description: Whether eligible files changed in edit mode
        value: ${{ jobs.execute-copilot.outputs.changes-detected }}

jobs:
  execute-copilot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    outputs:
      ai-response: ${{ steps.execute.outputs.ai_response }}
      changes-detected: ${{ steps.detect.outputs.changed }}
      changes-artifact: ${{ steps.package.outputs.artifact }}
      base-sha: ${{ steps.package.outputs.base-sha }}
    steps:
      - name: Validate inputs
        env:
          MODE: ${{ inputs.execution-mode }}
          PROMPT: ${{ inputs.prompt }}
          COMMAND: ${{ inputs.command }}
          COMMIT_PATHS: ${{ inputs.commit-paths }}
        run: |
          set -euo pipefail
          [[ "$MODE" == text || "$MODE" == edit ]] || { echo '::error::execution-mode must be text or edit'; exit 1; }
          if [[ -n "${COMMAND//[[:space:]]/}" ]]; then
            [[ "$MODE" == edit ]] || { echo '::error::command requires execution-mode edit'; exit 1; }
          else
            [[ -n "${PROMPT//[[:space:]]/}" ]] || { echo '::error::prompt must not be empty when command is not set'; exit 1; }
          fi
          if [[ "$MODE" == edit ]]; then
            [[ -n "${COMMIT_PATHS//[[:space:]]/}" ]] || { echo '::error::commit-paths must not be empty'; exit 1; }
          fi

      - name: Checkout target repository
        if: inputs.execution-mode == 'edit'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-branch }}
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install GitHub Copilot CLI
        env:
          COPILOT_CLI_VERSION: ${{ inputs.copilot-cli-version }}
          DEFAULT_COPILOT_CLI_VERSION: 1.0.93
        run: |
          set -euo pipefail
          if [[ -n "$COPILOT_CLI_VERSION" ]] && npm view "@github/copilot@$COPILOT_CLI_VERSION" version >/dev/null 2>&1; then
            version_to_install="$COPILOT_CLI_VERSION"
          else
            echo "Unable to verify Copilot CLI version '$COPILOT_CLI_VERSION'; using '$DEFAULT_COPILOT_CLI_VERSION'."
            version_to_install="$DEFAULT_COPILOT_CLI_VERSION"
          fi
          npm install --global "@github/copilot@$version_to_install"

      - name: Run Copilot CLI
        id: execute
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN || github.token }}
          PROMPT: ${{ inputs.prompt }}
          COMMAND: ${{ inputs.command }}
          MODEL: ${{ inputs.model }}
          MODE: ${{ inputs.execution-mode }}
        run: |
          set -euo pipefail
          if [[ -n "${COMMAND//[[:space:]]/}" ]]; then
            # The command may call Copilot itself, e.g. `make docs`.
            timeout 10m bash -c "$COMMAND"
          elif [[ "$MODE" == edit ]]; then
            # Only allow Copilot's file-writing tools; do not grant blanket shell access.
            timeout 10m copilot --model="$MODEL" -p "$PROMPT" \
              --no-auto-update --no-ask-user --allow-tool='write' > "$RUNNER_TEMP/copilot-response.txt"
            echo 'Copilot execution completed; checking workspace changes.'
          else
            response="$(timeout 10m copilot --model="$MODEL" -p "$PROMPT" --no-auto-update --no-ask-user --silent)"
            [[ -n "${response//[[:space:]]/}" ]] || { echo '::error::Copilot returned an empty response'; exit 1; }
            delimiter="$(uuidgen)"
            {
              echo "ai_response<<$delimiter"
              printf '%s\n' "$response"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Detect eligible file changes
        if: inputs.execution-mode == 'edit'
        id: detect
        env:
          COMMIT_PATHS: ${{ inputs.commit-paths }}
        run: |
          set -euo pipefail
          git diff --check
          echo 'Workspace changes:'
          git status --short
          # Match the PR action's Git pathspecs and its comma/newline input parsing.
          python3 - <<'PY'
          import os, re, subprocess, uuid
          patterns = [p.strip() for p in re.split(r'[\n,]+', os.environ['COMMIT_PATHS']) if p.strip()]
          if not patterns:
              raise SystemExit('::error::commit-paths must contain at least one Git pathspec')
          eligible = subprocess.check_output(
              ['git', 'status', '--porcelain', '-z', '--untracked-files=all', '--', *patterns]
          )
          # git add fails if even one positive pathspec does not exist. Keep
          # exclusions, which must be evaluated together with the other paths.
          valid_patterns = []
          for pattern in patterns:
              if pattern.startswith((':!', ':^', ':(exclude)', ':(exclude,')):
                  valid_patterns.append(pattern)
              elif subprocess.check_output(
                  ['git', 'ls-files', '--cached', '--others', '--exclude-standard', '-z', '--', pattern]
              ):
                  valid_patterns.append(pattern)
          delimiter = str(uuid.uuid4())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"changed={'true' if eligible else 'false'}\n")
              out.write(f'paths<<{delimiter}\n' + '\n'.join(valid_patterns) + f'\n{delimiter}\n')
          print('Eligible changes detected:', bool(eligible))
          PY

      - name: Package eligible changes
        if: inputs.execution-mode == 'edit' && steps.detect.outputs.changed == 'true'
        id: package
        env:
          COMMIT_PATHS: ${{ steps.detect.outputs.paths }}
        run: |
          set -euo pipefail
          mapfile -t paths <<< "$COMMIT_PATHS"
          export GIT_INDEX_FILE="$RUNNER_TEMP/copilot-pr-index"
          git read-tree HEAD
          git add -A -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo '::error::eligible changes could not be staged'
            exit 1
          fi
          git diff --cached --binary --full-index --no-ext-diff \
            --src-prefix=a/ --dst-prefix=b/ HEAD > "$RUNNER_TEMP/changes.patch"
          {
            printf 'artifact=copilot-changes-%s\n' "$(uuidgen)"
            printf 'base-sha=%s\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload eligible changes
        if: inputs.execution-mode == 'edit' && steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ runner.temp }}/changes.patch
          if-no-files-found: error
          retention-days: 1

  create-pr:
    needs: execute-copilot
    if: inputs.execution-mode == 'edit' && needs.execute-copilot.outputs.changes-detected == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reusable-create-pull-request.yml
    with:
      head-branch: ${{ inputs.pr-branch }}
      base-branch: ${{ inputs.base-branch }}
      title: ${{ inputs.pr-title }}
      body: ${{ inputs.pr-body }}
      labels: ${{ inputs.pr-labels }}
      changes-artifact: ${{ needs.execute-copilot.outputs.changes-artifact }}
      base-sha: ${{ needs.execute-copilot.outputs.base-sha }}
      commit-message: "chore: apply automated changes"
    secrets:
      PR_TOKEN: ${{ secrets.PR_TOKEN }}
