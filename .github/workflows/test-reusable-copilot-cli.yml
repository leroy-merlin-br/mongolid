name: Test Reusable Copilot CLI

on:
  # TEMPORARY: remove before merging to master
  push:
    branches: [ci/add-workflow-to-document-changes-automatically]
  workflow_dispatch:
    inputs:
      base-branch:
        description: Base branch for edit mode tests
        required: true
        type: string
        default: master
      model:
        description: Copilot model ID
        required: true
        type: string
        default: auto

jobs:
  text:
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    uses: ./.github/workflows/reusable-copilot-cli.yml
    with:
      prompt: "Responda em uma frase curta: o que é um pull request? Não use ferramentas."
      model: ${{ inputs.model || 'auto' }}
    secrets:
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}

  edit:
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    uses: ./.github/workflows/reusable-copilot-cli.yml
    with:
      prompt: >-
        Crie somente o arquivo .github/copilot-test-${{ github.run_id }}-${{ github.run_attempt }}.md
        contendo o título Markdown "Teste do Copilot" e uma frase curta dizendo que esta é uma alteração de teste.
        Não altere outros arquivos.
      execution-mode: edit
      model: ${{ inputs.model || 'auto' }}
      base-branch: ${{ inputs.base-branch || 'master' }}
      pr-branch: automation/test-copilot-${{ github.run_id }}-${{ github.run_attempt }}
      pr-title: "test: validate Copilot edit mode"
      pr-body: "PR criada para testar o modo edit do workflow do Copilot. Pode ser fechada após a validação."
      commit-paths: .github/copilot-test-${{ github.run_id }}-${{ github.run_attempt }}.md
    secrets:
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
      PR_TOKEN: ${{ secrets.PR_TOKEN }}

  no-changes:
    permissions:
      contents: write
      pull-requests: write
      copilot-requests: write
    uses: ./.github/workflows/reusable-copilot-cli.yml
    with:
      prompt: "Não crie, modifique, renomeie ou exclua nenhum arquivo. Responda somente: nenhuma alteração necessária."
      execution-mode: edit
      model: ${{ inputs.model || 'auto' }}
      base-branch: ${{ inputs.base-branch || 'master' }}
      pr-branch: automation/test-copilot-no-changes-${{ github.run_id }}-${{ github.run_attempt }}
      pr-title: "test: unexpected Copilot changes"
      pr-body: "Esta PR foi criada inesperadamente durante o teste sem alterações. Investigue e feche após a validação."
      commit-paths: .
    secrets:
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
      PR_TOKEN: ${{ secrets.PR_TOKEN }}

  verify:
    if: always()
    needs: [text, edit, no-changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate scenario results
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN || github.token }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.PR_TOKEN || github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TEXT_RESULT: ${{ needs.text.result }}
          TEXT_RESPONSE: ${{ needs.text.outputs.ai-response }}
          TEXT_PR_NUMBER: ${{ needs.text.outputs.pull-request-number }}
          EDIT_RESULT: ${{ needs.edit.result }}
          EDIT_CHANGED: ${{ needs.edit.outputs.changes-detected }}
          EDIT_PR_NUMBER: ${{ needs.edit.outputs.pull-request-number }}
          EDIT_PR_URL: ${{ needs.edit.outputs.pull-request-url }}
          NO_CHANGES_RESULT: ${{ needs.no-changes.result }}
          NO_CHANGES_CHANGED: ${{ needs.no-changes.outputs.changes-detected }}
          NO_CHANGES_PR_NUMBER: ${{ needs.no-changes.outputs.pull-request-number }}
          NO_CHANGES_PR_URL: ${{ needs.no-changes.outputs.pull-request-url }}
        shell: bash
        run: |
          set -euo pipefail
          export GH_HOST="${SERVER_URL#https://}"
          failed=0
          {
            echo '## Teste do reusable Copilot CLI'
            printf '\n- Text: %s\n- Edit: %s\n- Sem alterações: %s\n' "$TEXT_RESULT" "$EDIT_RESULT" "$NO_CHANGES_RESULT"
            if [[ -n "$EDIT_PR_URL" ]]; then printf '\nPR do teste edit: %s\n' "$EDIT_PR_URL"; fi
            if [[ -n "$NO_CHANGES_PR_URL" ]]; then printf '\nPR inesperada do teste sem alterações: %s\n' "$NO_CHANGES_PR_URL"; fi
            echo
            echo 'Após a validação, feche as PRs de teste e apague as respectivas branches, se não forem mais necessárias.'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$TEXT_RESULT" != success || -z "${TEXT_RESPONSE//[[:space:]]/}" || -n "$TEXT_PR_NUMBER" ]]; then
            echo '::error::text mode did not return a response without creating a PR'
            failed=1
          fi
          if [[ "$EDIT_RESULT" != success || "$EDIT_CHANGED" != true || ! "$EDIT_PR_NUMBER" =~ ^[0-9]+$ || -z "$EDIT_PR_URL" ]]; then
            echo '::error::edit mode did not report changes and a pull request'
            failed=1
          else
            expected_file=".github/copilot-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
            if ! gh api --paginate --slurp "repos/$REPOSITORY/pulls/$EDIT_PR_NUMBER/files" |
              jq -e --arg file "$expected_file" '[.[][] | .filename] == [$file]' >/dev/null; then
              echo '::error::edit pull request does not contain exactly the expected test file'
              failed=1
            fi
          fi
          if [[ "$NO_CHANGES_RESULT" != success || "$NO_CHANGES_CHANGED" != false || -n "$NO_CHANGES_PR_NUMBER" || -n "$NO_CHANGES_PR_URL" ]]; then
            echo '::error::no-changes mode detected changes or returned a pull request'
            failed=1
          fi
          exit "$failed"
