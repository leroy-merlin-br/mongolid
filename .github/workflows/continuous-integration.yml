name: Continuous Integration
on:
  - pull_request
  - push
jobs:
  testing:
    name: Tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        mongo:
          - "7.0"
          # Includes the fix for Ubuntu's kernel version check (SERVER-125742).
          - "8.0.38"
    services:
      mongodb:
        image: mongo:${{ matrix.mongo }}
        ports:
          - "27017:27017"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mongodb-1.21.13

      - name: Composer
        uses: ramsey/composer-install@v2

      - name: Running tests
        run: vendor/bin/phpunit -c phpunit.xml.dist --coverage-clover=./coverage/clover.xml

      - name: Report coverage
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          .codacy/get.sh report --project-token "$CODACY_PROJECT_TOKEN" -r ./coverage/clover.xml --partial
          .codacy/get.sh final --project-token "$CODACY_PROJECT_TOKEN"
